name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/lm75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Тесты на компьютере
        run: cargo test
      - name: Сборка под микроконтроллер (проверка no_std)
        run: cargo build --target thumbv6m-none-eabi
